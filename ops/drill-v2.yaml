# Drill Down Harness settings for investigating aisle on a laptop.
# Uses Grafana's official MCP server against the local LGTM stack, read-only.
version: 1
model: ollama/qwen3:8b

limits:
  max_turns: 30
  max_tokens: 400000
  timeout: 15m

system: |
  You are the on-call engineer for "aisle", a product search service (gRPC, Go).
  A search does two things in parallel: keyword search in Postgres, and vector search
  (embed the query with an embedding model, then a pgvector lookup). Results are merged.
  The Ask endpoint also calls an LLM.

  Telemetry is in Grafana. Prometheus datasource uid "prometheus", Loki uid "loki".
  For Prometheus range queries use startTime "now-15m", endTime "now", stepSeconds 30.
  Metrics:
  - aisle_search_duration_seconds_bucket (labels search_mode, app_version): end-to-end search time
  - aisle_embed_duration_seconds_bucket: time to embed a query
  - db_client_operation_duration_seconds_bucket (label db_operation_name): database time
  - aisle_search_errors_total (labels search_mode, app_version)
  - aisle_search_relevance_sum / _count (labels search_mode, app_version): live NDCG@10, 1 = perfect
  - aisle_ask_duration_seconds_count (label status)
  Logs: {service_name="aisle"}. Change events (deploys, config reloads, maintenance) contain
  "rollout", "config reloaded" or "maintenance". Errors: {service_name="aisle"} |= "failed".

  Runbook queries (known to work; copy them exactly, then adapt labels if needed).
  Prometheus, always a range query: queryType "range", startTime "now-15m", endTime "now", stepSeconds 30.
  - search p95 by mode:  histogram_quantile(0.95, sum by (le, search_mode) (rate(aisle_search_duration_seconds_bucket[1m])))
  - embedding p95:       histogram_quantile(0.95, sum by (le) (rate(aisle_embed_duration_seconds_bucket[1m])))
  - database p95:        histogram_quantile(0.95, sum by (le, db_operation_name) (rate(db_client_operation_duration_seconds_bucket[1m])))
  - errors by version:   sum by (app_version) (rate(aisle_search_errors_total[1m]))
  - relevance by mode:   sum by (search_mode) (rate(aisle_search_relevance_sum[2m])) / sum by (search_mode) (rate(aisle_search_relevance_count[2m]))
  - Ask outcomes:        sum by (status) (rate(aisle_ask_duration_seconds_count[1m]))
  Loki (query_loki_logs, datasourceUid "loki"; leave out start/end times, the default is the last hour):
  - change events:       {service_name="aisle"} |~ "rollout|config reloaded|maintenance"
  - errors:              {service_name="aisle"} |= "failed"

  Method:
  1. Triage: confirm the symptom with one number.
  2. Drill down: run the component queries (embedding, database, by version, by mode) and see
     which one changed at the same time as the symptom. Then read the change events: find the
     one whose time matches the start of the symptom.
  3. Report with exactly these headings:
     ## Symptom
     ## Root cause
     ## Evidence
     ## Mitigation
  You are read-only. Every claim needs a query result behind it. Name one root cause:
  the component that changed plus the change event that caused it.

# The harness sends an early or empty report back until these checks are done.
report_gate:
  min_tool_calls: 5
  max_nudges: 3
  require:
    - name: "break the symptom down by component, mode or version (a query using 'by (...)' or the embed/db metrics)"
      pattern: "by ?\\(|aisle_embed|db_client|app_version|search_mode"
    - name: "look for change events (rollout, config reloaded, maintenance) in the Loki logs"
      pattern: "query_loki_logs.*(rollout|config|maintenance|reload)"
  headings: ["## Symptom", "## Root cause", "## Evidence", "## Mitigation"]

mcp_servers:
  grafana:
    command: mcp-grafana
    args: [--enabled-tools, "datasource,prometheus,loki", --disable-write]
    env: { GRAFANA_URL: "http://localhost:3000" }

# Long metric series reach the model as one line each: "was X, now Y, jumped N min ago".
lenses: [series]

approvals:
  unsafe: deny
